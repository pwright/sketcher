title: Skupper Online Boutique
subtitle: A Cloud-Native gRPC microservice-based application deployed across multiple
  Kubernetes clusters using Skupper
overview: 'This tutorial demonstrates how to deploy the [Online

  Boutique](https://github.com/GoogleCloudPlatform/microservices-demo/)

  microservices demo application across multiple Kubernetes clusters that are

  located in different public and private cloud providers. This project

  contains a 10-tier microservices application developed by Google to

  demonstrate the use of technologies like Kubernetes.


  In this tutorial, you will create a Virtual Application Network that enables

  communications across the public and private clusters. You will then deploy a

  subset of the application''s grpc based microservices to each cluster. You

  will then access the `Online Boutique` web interface to browse items, add

  them to the cart and purchase them.

  '
sites:
  grpc-a:
    title: gRPC A
    platform: kubernetes
    namespace: grpc-a
    env:
      KUBECONFIG: ~/.kube/config-grpc-a
  grpc-b:
    title: gRPC B
    platform: kubernetes
    namespace: grpc-b
    env:
      KUBECONFIG: ~/.kube/config-grpc-b
  grpc-c:
    title: gRPC C
    platform: kubernetes
    namespace: grpc-c
    env:
      KUBECONFIG: ~/.kube/config-grpc-c
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: 'Skupper is designed for use with multiple Kubernetes clusters.

    The `skupper` and `kubectl` commands use your

    [kubeconfig][kubeconfig] and current context to select the cluster

    and namespace where they operate.


    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/


    This example uses multiple cluster contexts at once. The

    `KUBECONFIG` environment variable tells `skupper` and `kubectl`

    which kubeconfig to use.


    For each cluster, open a new terminal window.  In each terminal,

    set the `KUBECONFIG` environment variable to a different path and

    log in to your cluster.'
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    grpc-a:
    - run: export KUBECONFIG=~/.kube/config-grpc-a
    - run: <provider-specific login command>
      apply: readme
    grpc-b:
    - run: export KUBECONFIG=~/.kube/config-grpc-b
    - run: <provider-specific login command>
      apply: readme
    grpc-c:
    - run: export KUBECONFIG=~/.kube/config-grpc-c
    - run: <provider-specific login command>
      apply: readme
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: 'Using Skupper on Kubernetes requires the installation of the

    Skupper custom resource definitions (CRDs) and the Skupper

    controller.


    For each cluster, use `kubectl apply` with the Skupper

    installation YAML to install the CRDs and controller.'
  commands:
    grpc-a:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    grpc-b:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    grpc-c:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Apply Kubernetes Resources
  preamble: 'Apply the application deployment resources alongside the skupper

    resources describing the application network.

    '
  commands:
    grpc-a:
    - run: kubectl create namespace grpc-a
    - run: kubectl apply -f resources-a
    grpc-b:
    - run: kubectl create namespace grpc-b
    - run: kubectl apply -f resources-b
    grpc-c:
    - run: kubectl create namespace grpc-c
    - run: kubectl apply -f resources-c
- title: Wait for Sites Ready
  preamble: 'Before linking sites to form the network, wait for the Sites to be ready.

    '
  commands:
    grpc-a:
    - run: kubectl wait --for condition=Ready site/grpc-a --timeout 240s
    grpc-b:
    - run: kubectl wait --for condition=Ready site/grpc-b --timeout 240s
    grpc-c:
    - run: kubectl wait --for condition=Ready site/grpc-c --timeout 240s
- title: Install the Skupper command-line tool
  numbered: true
  preamble: 'This example uses the Skupper command-line tool to create Skupper

    resources.  You need to install the `skupper` command only once

    for each development environment.


    On Linux or Mac, you can use the install script (inspect it

    [here][install-script]) to download and extract the command:


    ~~~ shell

    curl https://skupper.io/v2/install.sh | sh

    ~~~


    The script installs the command under your home directory.  It

    prompts you to add the command to your path if necessary.


    For Windows and other installation options, see [Installing

    Skupper][install-docs].


    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh

    [install-docs]: https://skupper.io/#installation'
- commands:
    grpc-a:
    - run: skupper token issue ~/grpc-a.token --redemptions-allowed=2
      output: "Waiting for token status ...\n\nGrant \"grpc-a-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c\"\
        \ is ready\nToken file grpc-a.token created\n\nTransfer this file to a remote\
        \ site. At the remote site,\ncreate a link to this site using the \"skupper\
        \ token redeem\" command:\n\n\tskupper token redeem <file>\n\nThe token expires\
        \ after 1 use(s) or after 15m0s.\n"
    grpc-b:
    - run: skupper token issue ~/grpc-b.token
    - run: skupper token redeem ~/grpc-a.token
      output: 'Waiting for token status ...

        Token "grpc-a-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c" has been redeemed

        You can now safely delete /run/user/1000/skewer/secret.token

        '
    grpc-c:
    - run: skupper token redeem ~/grpc-a.token
      output: 'Waiting for token status ...

        Token "grpc-a-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c" has been redeemed

        You can now safely delete /run/user/1000/skewer/secret.token

        '
    - run: skupper token redeem ~/grpc-b.token
      output: 'Waiting for token status ...

        Token "grpc-b-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c" has been redeemed

        You can now safely delete /run/user/1000/skewer/secret.token

        '
  title: Link your sites
  numbered: true
  preamble: 'A Skupper _link_ is a channel for communication between two sites.

    Links serve as a transport for application connections and

    requests.


    Creating a link requires the use of two Skupper commands in

    conjunction: `skupper token issue` and `skupper token redeem`.

    The `skupper token issue` command generates a secret token that

    can be transferred to a remote site and redeemed for a link to the

    issuing site.  The `skupper token redeem` command uses the token

    to create the link.


    **Note:** The link token is truly a *secret*.  Anyone who has the

    token can link to your site.  Make sure that only those you trust

    have access to it.


    First, use `skupper token issue` in gRPC A to generate the token.

    Then, use `skupper token redeem` in gRPC B to link the sites.'
  postamble: 'If your terminal sessions are on different machines, you may need

    to use `scp` or a similar tool to transfer the token securely.  By

    default, tokens expire after a single use or 15 minutes after

    being issued.'
- title: Access the Boutique Shop application
  preamble: 'The web frontend for the Online Boutique application can be accessed

    via the frontend-external service. In the terminal for the **gRPC A**

    cluster, get the shop URL and open it in a browser.

    '
  commands:
    grpc-a:
    - run: 'echo "http://$(kubectl get service frontend-external -n grpc-a -o=jsonpath=''{.spec.clusterIP}'')/"

        '
  postamble: 'Open a browser and use the URL provided above to access the Online

    Boutique.

    '
- title: Run the load generator
  preamble: 'The Online Boutique application has a load generator that creates

    realistic usage patterns on the website.


    In the terminal for the **gRPC A** cluster, deploy the load

    generator from the project root directory.

    '
  commands:
    grpc-a:
    - run: kubectl apply -f loadgenerator/deployment-loadgenerator.yaml -n grpc-a
- title: Observe the load generator output
  preamble: 'In the terminal for the **gRPC A** cluster, observe the output

    from the load generator.

    '
  commands:
    grpc-a:
    - run: kubectl logs -f deploy/loadgenerator -n grpc-a
      apply: readme
- title: Stop the load generator
  preamble: 'In the terminal for the **gRPC A** cluster, stop the load

    generator.

    '
  commands:
    grpc-a:
    - run: kubectl delete -f loadgenerator/deployment-loadgenerator.yaml -n grpc-a
      apply: readme
- commands:
    grpc-a:
    - run: kubectl delete -f loadgenerator/deployment-loadgenerator.yaml -n grpc-a
        --ignore-not-found
    - run: kubectl delete -f resources-a
    grpc-b:
    - run: kubectl delete -f resources-b
    grpc-c:
    - run: kubectl delete -f resources-c
  name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: 'To remove Skupper and the other resources from this exercise, use

    the following commands.'
summary: 'This example locates the many services that make up a microservice

  application across three different namespaces on different clusters with no

  modifications to the application. Without Skupper, it would normally take

  careful network planning to avoid exposing these services over the public

  internet.


  Introducing Skupper into each namespace allows us to create a virtual

  application network that can connect services in different clusters. Any

  service exposed on the application network is represented as a local service in

  all of the linked namespaces.


  <img src="images/BoutiqueProcessLocations.png" width="600"/>

  '

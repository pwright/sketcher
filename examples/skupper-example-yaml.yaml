title: Skupper Hello World using YAML
subtitle: A minimal HTTP application deployed across Kubernetes clusters using Skupper
overview: "This example is a variant of [Skupper Hello World][hello-world] that\n\
  is deployed using YAML custom resources instead of imperative\ncommands.\n\nIt contains\
  \ two services:\n\n* A backend service that exposes an `/api/hello` endpoint.  It\n\
  \  returns greetings of the form `Hi, <your-name>.  I am <my-name>\n  (<pod-name>)`.\n\
  \n* A frontend service that sends greetings to the backend and\n  fetches new greetings\
  \ in response.\n\nIn this scenario, each service runs in a different Kubernetes\n\
  cluster.  The frontend runs in a namespace on cluster 1 called West,\nand the backend\
  \ runs in a namespace on cluster 2 called East.\n\n<img src=\"images/entities.svg\"\
  \ width=\"640\"/>\n\nSkupper enables you to place the backend in one cluster and\
  \ the\nfrontend in another and maintain connectivity between the two\nservices without\
  \ exposing the backend to the public internet.\n\n[hello-world]: https://github.com/skupperproject/skupper-example-hello-world\n"
sites:
  west:
    title: West
    platform: kubernetes
    namespace: west
    env:
      KUBECONFIG: ~/.kube/config-west
  east:
    title: East
    platform: kubernetes
    namespace: east
    env:
      KUBECONFIG: ~/.kube/config-east
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: 'Skupper is designed for use with multiple Kubernetes clusters.

    The `skupper` and `kubectl` commands use your

    [kubeconfig][kubeconfig] and current context to select the cluster

    and namespace where they operate.


    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/


    This example uses multiple cluster contexts at once. The

    `KUBECONFIG` environment variable tells `skupper` and `kubectl`

    which kubeconfig to use.


    For each cluster, open a new terminal window.  In each terminal,

    set the `KUBECONFIG` environment variable to a different path and

    log in to your cluster.'
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    west:
    - run: export KUBECONFIG=~/.kube/config-west
    - run: <provider-specific login command>
      apply: readme
    east:
    - run: export KUBECONFIG=~/.kube/config-east
    - run: <provider-specific login command>
      apply: readme
- title: Create your Kubernetes namespaces
  numbered: true
  preamble: 'The example application has different components deployed to

    different Kubernetes namespaces.  To set up our example, we need

    to create the namespaces.


    For each cluster, use `kubectl create namespace` and `kubectl

    config set-context` to create the namespace you wish to use and

    set the namespace on your current context.'
  commands:
    west:
    - run: kubectl create namespace west
      apply: readme
    - run: kubectl create namespace west --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace west
    east:
    - run: kubectl create namespace east
      apply: readme
    - run: kubectl create namespace east --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace east
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: 'Using Skupper on Kubernetes requires the installation of the

    Skupper custom resource definitions (CRDs) and the Skupper

    controller.


    For each cluster, use `kubectl apply` with the Skupper

    installation YAML to install the CRDs and controller.'
  commands:
    west:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    east:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Apply your YAML resources
  preamble: "To configure our example sites and service bindings, we are\nusing the\
    \ following resources:\n\nWest:\n\n* [site.yaml](west/site.yaml) - The Skupper\
    \ _Site_ resource for\n  West\n* [frontend.yaml](west/frontend.yaml) - The Hello\
    \ World frontend\n  deployment\n* [listener.yaml](west/listener.yaml) - A Skupper\
    \ _Listener_\n  resource for exposing the backend in East to the local\n  frontend\n\
    \nEast:\n\n* [site.yaml](east/site.yaml) - The Skupper _Site_ resource for\n \
    \ East\n* [backend.yaml](east/backend.yaml) - The Hello World backend\n  deployment\n\
    * [connector.yaml](east/connector.yaml) - A Skupper _Connector_\n  resource for\
    \ binding the backend to the listener in West\n\nLet's look at these resources\
    \ in more detail.\n\n### Resources in West\n\nThe _Site_ resource defines a Skupper\
    \ site for its associated\nKubernetes namespace.  This is where you set site configuration\n\
    options.  See the [Site resource reference][site-config] for\nmore information.\n\
    \nThe `linkAccess: default` field configures site West to accept\nsite-to-site\
    \ links.  This example creates a link from East to\nWest, so the receiving side,\
    \ West, must enable link access.\n\n[site-config]: https://skupperproject.github.io/refdog/resources/site.html\n\
    \n[site.yaml](west/site.yaml):\n\n~~~ yaml\napiVersion: skupper.io/v1alpha1\n\
    kind: Site\nmetadata:\n  name: west\n  namespace: west\nspec:\n  linkAccess: default\n\
    ~~~\n\nThe frontend is a standard Kubernetes deployment.\n\n[frontend.yaml](west/frontend.yaml):\n\
    \n~~~ yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: frontend\n\
    \  labels:\n    app: frontend\nspec:\n  selector:\n    matchLabels:\n      app:\
    \ frontend\n  replicas: 1\n  template:\n    metadata:\n      labels:\n       \
    \ app: frontend\n    spec:\n      containers:\n        - name: frontend\n    \
    \      image: quay.io/skupper/hello-world-frontend\n          ports:\n       \
    \     - containerPort: 8080\n~~~\n\nThe code in frontend makes API calls to\n\
    `http://backend:8080/api/hello`.  The _Listener_ resource below\nconfigures the\
    \ router to expose a connection endpoint at\n`backend:8080` and forward any connections\
    \ there to routers in\nremote sites using the routing key `backend`.  See the\
    \ [Listener\nresource reference][listener-config] for more information.\n\n[listener-config]:\
    \ https://skupperproject.github.io/refdog/resources/listener.html\n\n[listener.yaml](west/listener.yaml):\n\
    \n~~~ yaml\napiVersion: skupper.io/v1alpha1\nkind: Listener\nmetadata:\n  name:\
    \ backend\n  namespace: west\nspec:\n  port: 8080\n  host: backend\n  routingKey:\
    \ backend\n~~~\n\n### Resources in East\n\nThe _Site_ resource for East.\n\n[site.yaml](east/site.yaml):\n\
    \n~~~ yaml\napiVersion: skupper.io/v1alpha1\nkind: Site\nmetadata:\n  name: east\n\
    \  namespace: east\n~~~\n\nThe backend is a standard Kubernetes deployment.\n\n\
    [backend.yaml](east/backend.yaml):\n\n~~~ yaml\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  name: backend\n  labels:\n    app: backend\nspec:\n  selector:\n\
    \    matchLabels:\n      app: backend\n  replicas: 3\n  template:\n    metadata:\n\
    \      labels:\n        app: backend\n    spec:\n      containers:\n        -\
    \ name: backend\n          image: quay.io/skupper/hello-world-backend\n      \
    \    ports:\n            - containerPort: 8080\n~~~\n\nThe _Connector_ resource\
    \ below configures the router to take\nremote connections with routing key `backend`\
    \ and forward them\nto port 8080 on pods matching the selector `app=backend`.\
    \  See\nthe [Connector resource reference][connector-config] for more\ninformation.\n\
    \n[connector-config]: https://skupperproject.github.io/refdog/resources/connector.html\n\
    \n[connector.yaml](east/connector.yaml):\n\n~~~ yaml\napiVersion: skupper.io/v1alpha1\n\
    kind: Connector\nmetadata:\n  name: backend\n  namespace: east\nspec:\n  routingKey:\
    \ backend\n  port: 8080\n  selector: app=backend\n~~~\n\n### Applying the resources\n\
    \nNow we're ready to apply everything.  Use the `kubectl apply`\ncommand with\
    \ the resources for each site.\n\n**Note:** If you are using Minikube, [you need\
    \ to start\n`minikube tunnel`][minikube-tunnel] before you create the\nSkupper\
    \ sites.\n\n[minikube-tunnel]: https://skupper.io/start/minikube.html#running-minikube-tunnel\n"
  commands:
    west:
    - run: kubectl apply -f west/site.yaml -f west/frontend.yaml -f west/listener.yaml
      output: 'site.skupper.io/west created

        deployment.apps/frontend created

        listener.skupper.io/backend created

        '
    - run: kubectl wait site/west --for condition=Ready --timeout 2m
      apply: test
    - await_resource: deployment/frontend
    east:
    - run: kubectl apply -f east/site.yaml -f east/backend.yaml -f east/connector.yaml
      output: 'site.skupper.io/east created

        deployment.apps/backend created

        connector.skupper.io/backend created

        '
    - run: kubectl wait site/east --for condition=Ready --timeout 2m
      apply: test
    - await_resource: deployment/backend
- preamble: 'A Skupper _link_ is a channel for communication between two

    sites.  Links serve as a transport for application connections

    and requests.


    You can configure sites and service bindings declaratively, but

    linking sites is different.  To create a link, you must have the

    authentication secret and connection details of the remote site.

    Since these cannot always be known in advance, linking is

    usually procedural, not declarative.


    <!--

    **Note:** There are several ways to automate the generation and

    distribution of tokens across sites, using for example Ansible,

    Backstage, or Vault.  See [Token distribution][XXX] for more

    information.

    -->


    Skupper provides tokens as one way to securely create

    site-to-site links.  This example uses the Skupper command-line

    tool to issue the secret token in West and redeem the token for

    a link in East.


    To install the Skupper command:


    ~~~ shell

    curl https://skupper.io/v2/install.sh | sh

    ~~~


    For more installation options, see [Installing

    Skupper][install].


    Once the command is installed, use `skupper token issue` in West

    to generate the token.  Then, use `skupper token redeem` in East

    to create the link.


    [install]: https://skupper.io/install/index.html'
  title: Link your sites
  numbered: true
  postamble: 'If your terminal sessions are on different machines, you may need

    to use `scp` or a similar tool to transfer the token securely.  By

    default, tokens expire after a single use or 15 minutes after

    being issued.'
  commands:
    west:
    - run: skupper token issue ~/secret.token
      output: "Waiting for token status ...\n\nGrant \"west-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c\"\
        \ is ready\nToken file /run/user/1000/skewer/secret.token created\n\nTransfer\
        \ this file to a remote site. At the remote site,\ncreate a link to this site\
        \ using the \"skupper token redeem\" command:\n\n\tskupper token redeem <file>\n\
        \nThe token expires after 1 use(s) or after 15m0s.\n"
    east:
    - run: skupper token redeem ~/secret.token
      output: 'Waiting for token status ...

        Token "west-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c" has been redeemed

        You can now safely delete /run/user/1000/skewer/secret.token

        '
- title: Access the frontend service
  numbered: true
  preamble: 'In order to use and test the application, we need external access

    to the frontend.


    Use `kubectl port-forward` to make the frontend available at

    `localhost:8080`.'
  postamble: 'You can now access the web interface by navigating to

    [http://localhost:8080](http://localhost:8080) in your browser.'
  commands:
    west:
    - await_resource: deployment/frontend
    - run: kubectl port-forward deployment/frontend 8080:8080
      apply: readme
    - run: kubectl port-forward deployment/frontend 8080:8080 > /dev/null &
      apply: test
- commands:
    west:
    - run: kubectl delete -f west/ --ignore-not-found
    east:
    - run: kubectl delete -f east/ --ignore-not-found
  name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: 'To remove Skupper and the other resources from this exercise, use

    the following commands.'

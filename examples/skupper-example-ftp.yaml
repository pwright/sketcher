title: Accessing an FTP server using Skupper
subtitle: Securely connect to an FTP server on a remote Kubernetes cluster
overview: 'This example shows you how you can use Skupper to connect an FTP

  client on one Kubernetes cluster to an FTP server on another.


  It demonstrates use of Skupper with multi-port services such as FTP.

  It uses FTP in passive mode (which is more typical these days) and a

  [restricted port range][ports] that simplifies Skupper

  configuration.


  [ports]: https://github.com/skupperproject/skupper-example-ftp/blob/main/server/kubernetes.yaml#L25-L28

  '
sites:
  public:
    title: Public
    platform: kubernetes
    namespace: public
    env:
      KUBECONFIG: ~/.kube/config-public
  private:
    title: Private
    platform: kubernetes
    namespace: private
    env:
      KUBECONFIG: ~/.kube/config-private
steps:
- title: Install the Skupper command-line tool
  numbered: true
  preamble: 'This example uses the Skupper command-line tool to create Skupper

    resources.  You need to install the `skupper` command only once

    for each development environment.


    On Linux or Mac, you can use the install script (inspect it

    [here][install-script]) to download and extract the command:


    ~~~ shell

    curl https://skupper.io/v2/install.sh | sh

    ~~~


    The script installs the command under your home directory.  It

    prompts you to add the command to your path if necessary.


    For Windows and other installation options, see [Installing

    Skupper][install-docs].


    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh

    [install-docs]: https://skupper.io/#installation'
- title: Access your Kubernetes clusters
  numbered: true
  preamble: 'Skupper is designed for use with multiple Kubernetes clusters.

    The `skupper` and `kubectl` commands use your

    [kubeconfig][kubeconfig] and current context to select the cluster

    and namespace where they operate.


    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/


    This example uses multiple cluster contexts at once. The

    `KUBECONFIG` environment variable tells `skupper` and `kubectl`

    which kubeconfig to use.


    For each cluster, open a new terminal window.  In each terminal,

    set the `KUBECONFIG` environment variable to a different path and

    log in to your cluster.'
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    public:
    - run: export KUBECONFIG=~/.kube/config-public
    - run: <provider-specific login command>
      apply: readme
    private:
    - run: export KUBECONFIG=~/.kube/config-private
    - run: <provider-specific login command>
      apply: readme
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: 'Using Skupper on Kubernetes requires the installation of the

    Skupper custom resource definitions (CRDs) and the Skupper

    controller.


    For each cluster, use `kubectl apply` with the Skupper

    installation YAML to install the CRDs and controller.'
  commands:
    public:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    private:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Create your sites
  preamble: 'A Skupper _site_ is a location where components of your

    application are running.  Sites are linked together to form a

    network for your application.  In Kubernetes, a site is associated

    with a namespace.


    Use the kubectl apply command to declaratively create sites in the kubernetes

    namespaces. This deploys the Skupper router. Then use kubectl get site to see

    the outcome.


    **Note:** If you are using Minikube, you need to [start minikube

    tunnel][minikube-tunnel] before you configure skupper.


    [minikube-tunnel]: https://skupper.io/start/minikube.html#running-minikube-tunnel

    '
  commands:
    public:
    - run: kubectl apply -f ./public-crs/site.yaml
    - run: kubectl wait --for condition=Ready --timeout=3m site/public
      output: 'site.skupper.io/public created

        site.skupper.io/public condition met

        '
    private:
    - run: kubectl apply -f ./private-crs/site.yaml
    - run: kubectl wait --for condition=Ready --timeout=3m site/private
      output: 'site.skupper.io/private created

        site.skupper.io/private condition met

        '
- title: Link your sites
  preamble: 'A Skupper _link_ is a channel for communication between two sites.

    Links serve as a transport for application connections and

    requests.


    Creating a link requires use of two `skupper` commands in

    conjunction, `skupper token issue` and `skupper token redeem`.


    The `skupper token issue` command generates a secret token that

    signifies permission to create a link.  The token also carries the

    link details.  Then, in a remote site, The `skupper token

    redeem` command uses the token to create a link to the site

    that generated it.


    **Note:** The link token is truly a *secret*.  Anyone who has the

    token can link to your site.  Make sure that only those you trust

    have access to it.


    First, use `skupper token issue` in public to generate the

    token.  Then, use `skupper token redeem` in private to link the

    sites.

    '
  commands:
    public:
    - run: skupper token issue ~/public.token
    private:
    - run: skupper token redeem ~/public.token
  postamble: 'If your terminal sessions are on different machines, you may need

    to use `scp` or a similar tool to transfer the token securely.  By

    default, tokens expire after a single use or 15 minutes after

    creation.  User skupper link status command to check link is in operational state.

    '
- title: Deploy the FTP server
  preamble: 'In Private, use `kubectl apply` to deploy the FTP server.

    '
  commands:
    private:
    - run: kubectl apply -f ./private-crs/ftp_service.yaml
      output: deployment.apps/ftp-server created
- title: Expose the FTP server to the Virtual Application Network
  preamble: "Create Skupper listeners and connectors to expose the FTP service to\
    \ the public cluster.\nThe vsftp app used in this example uses port 21 as the\
    \ control port, which is utilized\nto send commands to the FTP servier like login,\
    \ list and get.   Port 21100 is used to \ntransfer data between the FTP client\
    \ and server.  In private, we will create two connectors. \nThen, in public, we\
    \ will create two listeners.\n"
  commands:
    private:
    - await_resource: deployment/ftp-server
    - run: kubectl apply -f ./private-crs/connector.yaml
      output: 'connector.skupper.io/ftp-server created

        connector.skupper.io/ftp-passive created

        '
    public:
    - run: kubectl apply -f ./public-crs/listener.yaml
      output: 'listener.skupper.io/ftp-server created

        listener.skupper.io/ftp-passive created

        '
  postamble: 'Status of the listeners and connectors can be verified using `show connector
    status` and

    `show listener status`.

    '
- title: Run the FTP client for put operation
  preamble: "In Public, use `kubectl run` and the `curl` image to perform FTP put\
    \ operations.  \n"
  commands:
    public:
    - await_resource: service/ftp-server
    - run: echo "Hello!" | kubectl run ftp-client --stdin --rm --image=docker.io/curlimages/curl
        --restart=Never -- -s -T - ftp://example:example@ftp-server/greeting
      output: pod "ftp-client" deleted
- title: Run the FTP client for get operation
  preamble: "In Public, use `kubectl run` and the `curl` image to perform FTP get\
    \ operations.  \n"
  commands:
    public:
    - run: kubectl run ftp-client --attach --rm --image=docker.io/curlimages/curl
        --restart=Never -- -s ftp://example:example@ftp-server/greeting
      output: 'Hello!

        pod "ftp-client" deleted

        '
- title: Cleaning Up
  preamble: 'To test remove Skupper and the other resources from this exercise, use

    the following commands.

    '
  commands:
    private:
    - run: skupper site delete --all
    - run: kubectl delete deployment/ftp-server
    public:
    - run: skupper site delete --all

title: Accessing an ActiveMQ message broker using Skupper
subtitle: Use public cloud resources to process data from a private message broker
overview: |
  This example is a simple message application that shows how you can
  use Skupper to access an ActiveMQ broker at a remote site without
  exposing it to the public internet.

  It contains two services:

  * An ActiveMQ broker named `broker1` running in a private data center.
    The broker has a queue named `queue1`.

  * An AMQP client running in the public cloud.  It sends 10 messages
    to `queue1` and then receives them back.

  The example uses two Kubernetes namespaces, `private` and `public`,
  to represent the private data center and public cloud.
sites:
  public:
    title: Public
    platform: kubernetes
    namespace: public
    env:
      KUBECONFIG: ~/.kube/config-public
  private:
    title: Private
    platform: kubernetes
    namespace: private
    env:
      KUBECONFIG: ~/.kube/config-private
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: |-
    Skupper is designed for use with multiple Kubernetes clusters.
    The `skupper` and `kubectl` commands use your
    [kubeconfig][kubeconfig] and current context to select the cluster
    and namespace where they operate.

    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/

    This example uses multiple cluster contexts at once. The
    `KUBECONFIG` environment variable tells `skupper` and `kubectl`
    which kubeconfig to use.

    For each cluster, open a new terminal window.  In each terminal,
    set the `KUBECONFIG` environment variable to a different path and
    log in to your cluster.
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    public:
    - run: export KUBECONFIG=~/.kube/config-public
    - run: <provider-specific login command>
      apply: readme
    private:
    - run: export KUBECONFIG=~/.kube/config-private
    - run: <provider-specific login command>
      apply: readme
- title: Create your Kubernetes namespaces
  numbered: true
  preamble: |-
    The example application has different components deployed to
    different Kubernetes namespaces.  To set up our example, we need
    to create the namespaces.

    For each cluster, use `kubectl create namespace` and `kubectl
    config set-context` to create the namespace you wish to use and
    set the namespace on your current context.
  commands:
    public:
    - run: kubectl create namespace public
      apply: readme
    - run: kubectl create namespace public --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace public
    private:
    - run: kubectl create namespace private
      apply: readme
    - run: kubectl create namespace private --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace private
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: |-
    Using Skupper on Kubernetes requires the installation of the
    Skupper custom resource definitions (CRDs) and the Skupper
    controller.

    For each cluster, use `kubectl apply` with the Skupper
    installation YAML to install the CRDs and controller.
  commands:
    public:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    private:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Install the Skupper command-line tool
  numbered: true
  preamble: |-
    This example uses the Skupper command-line tool to create Skupper
    resources.  You need to install the `skupper` command only once
    for each development environment.

    On Linux or Mac, you can use the install script (inspect it
    [here][install-script]) to download and extract the command:

    ~~~ shell
    curl https://skupper.io/v2/install.sh | sh
    ~~~

    The script installs the command under your home directory.  It
    prompts you to add the command to your path if necessary.

    For Windows and other installation options, see [Installing
    Skupper][install-docs].

    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh
    [install-docs]: https://skupper.io/#installation
- title: Deploy the message broker
  commands:
    private:
    - run: kubectl apply -f broker1.yaml
    - await_resource: deployment/broker1
- title: Create your sites
  preamble: |
    Use `skupper site create` to configure each location.  Enable link
    access on Public so it can issue tokens.  Disable ingress on
    Private to keep the broker hidden from the internet.
  commands:
    public:
    - run: skupper site create public --enable-link-access
    private:
    - run: skupper site create private
- title: Link your sites
  preamble: |
    Use `skupper token issue` in Public to generate a token, then use
    `skupper token redeem` in Private to create the link.  The token is
    a secret; handle it carefully.
  commands:
    public:
    - run: skupper token issue ~/public.token
    private:
    - run: skupper token redeem ~/public.token
- title: Expose the message broker
  preamble: |
    Create a listener in Public where the client runs.  Create a
    connector in Private so the broker workload is reachable on the
    network under the service name `broker1`.
  commands:
    public:
    - run: skupper listener create broker1 5672
    private:
    - run: skupper connector create broker1 5672
- title: Run the client
  commands:
    public:
    - run: kubectl run client --attach --rm --restart Never --image quay.io/skupper/activemq-example-client
        --env SERVER=broker1 --pod-running-timeout=5m
- commands:
    public:
    - run: skupper site delete --all
    private:
    - run: skupper site delete --all
    - run: kubectl delete deployment/broker1
  name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: |-
    To remove Skupper and the other resources from this exercise, use
    the following commands.
summary: |
  Skupper creates a virtual application network that lets the client in
  `public` reach the broker in `private` without exposing the broker to
  the internet.  The listener in `public` makes `broker1` appear local,
  and the connector in `private` forwards the traffic to the actual
  Artemis deployment.

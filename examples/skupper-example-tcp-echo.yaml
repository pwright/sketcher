title: Skupper enables inter-cluster TCP communication
subtitle: TCP tunneling with Skupper
overview: 'This is a simple demonstration of TCP communication tunneled through

  a Skupper network from a private to a public cluster and back again.

  During development of this demonstration, the private cluster was

  running locally, while the public cluster was on AWS.


  We set up a Skupper network between the two clusters, start a TCP

  echo-server on the public cluster, then communicate to it from the

  private cluster and receive its replies. At no time is any port

  opened on the machine running the private cluster.


  <img src="images/entities.svg" width="800"/>

  '
sites:
  public:
    title: Public
    platform: kubernetes
    namespace: public
    env:
      KUBECONFIG: /tmp/public-kubeconfig
  private:
    title: Private
    platform: kubernetes
    namespace: private
    env:
      KUBECONFIG: /tmp/private-kubeconfig
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: 'Skupper is designed for use with multiple Kubernetes clusters.

    The `skupper` and `kubectl` commands use your

    [kubeconfig][kubeconfig] and current context to select the cluster

    and namespace where they operate.


    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/


    This example uses multiple cluster contexts at once. The

    `KUBECONFIG` environment variable tells `skupper` and `kubectl`

    which kubeconfig to use.


    For each cluster, open a new terminal window.  In each terminal,

    set the `KUBECONFIG` environment variable to a different path and

    log in to your cluster.'
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    public:
    - run: export KUBECONFIG=/tmp/public-kubeconfig
    - run: <provider-specific login command>
      apply: readme
    private:
    - run: export KUBECONFIG=/tmp/private-kubeconfig
    - run: <provider-specific login command>
      apply: readme
- title: Create your Kubernetes namespaces
  numbered: true
  preamble: 'The example application has different components deployed to

    different Kubernetes namespaces.  To set up our example, we need

    to create the namespaces.


    For each cluster, use `kubectl create namespace` and `kubectl

    config set-context` to create the namespace you wish to use and

    set the namespace on your current context.'
  commands:
    public:
    - run: kubectl create namespace public
      apply: readme
    - run: kubectl create namespace public --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace public
    private:
    - run: kubectl create namespace private
      apply: readme
    - run: kubectl create namespace private --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace private
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: 'Using Skupper on Kubernetes requires the installation of the

    Skupper custom resource definitions (CRDs) and the Skupper

    controller.


    For each cluster, use `kubectl apply` with the Skupper

    installation YAML to install the CRDs and controller.'
  commands:
    public:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    private:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Install the Skupper command-line tool
  numbered: true
  preamble: 'This example uses the Skupper command-line tool to create Skupper

    resources.  You need to install the `skupper` command only once

    for each development environment.


    On Linux or Mac, you can use the install script (inspect it

    [here][install-script]) to download and extract the command:


    ~~~ shell

    curl https://skupper.io/v2/install.sh | sh

    ~~~


    The script installs the command under your home directory.  It

    prompts you to add the command to your path if necessary.


    For Windows and other installation options, see [Installing

    Skupper][install-docs].


    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh

    [install-docs]: https://skupper.io/#installation'
- title: Deploy the TCP echo server
  commands:
    public:
    - run: kubectl apply -f ./public/tcp-echo-deployment.yaml
- title: Create your sites
  numbered: true
  preamble: 'A Skupper _site_ is a location where your application workloads

    are running.  Sites are linked together to form a network for your

    application.


    For each namespace, use `skupper site create` with a site name of

    your choice.  This creates the site resource and deploys the

    Skupper router to the namespace.


    **Note:** If you are using Minikube, you need to [start minikube

    tunnel][minikube-tunnel] before you run `skupper site create`.


    <!-- XXX Explain enabling link acesss on one of the sites -->


    [minikube-tunnel]: https://skupper.io/start/minikube.html#running-minikube-tunnel'
  postamble: 'You can use `skupper site status` at any time to check the status

    of your site.'
  commands:
    public:
    - run: skupper site create public --enable-link-access
      output: 'Waiting for status...

        Site "public" is configured. Check the status to see when it is ready

        '
    private:
    - run: skupper site create private
      output: 'Waiting for status...

        Site "private" is configured. Check the status to see when it is ready

        '
- title: Link your sites
  numbered: true
  preamble: 'A Skupper _link_ is a channel for communication between two sites.

    Links serve as a transport for application connections and

    requests.


    Creating a link requires the use of two Skupper commands in

    conjunction: `skupper token issue` and `skupper token redeem`.

    The `skupper token issue` command generates a secret token that

    can be transferred to a remote site and redeemed for a link to the

    issuing site.  The `skupper token redeem` command uses the token

    to create the link.


    **Note:** The link token is truly a *secret*.  Anyone who has the

    token can link to your site.  Make sure that only those you trust

    have access to it.


    First, use `skupper token issue` in Public to generate the token.

    Then, use `skupper token redeem` in Private to link the sites.'
  postamble: 'If your terminal sessions are on different machines, you may need

    to use `scp` or a similar tool to transfer the token securely.  By

    default, tokens expire after a single use or 15 minutes after

    being issued.'
  commands:
    public:
    - run: skupper token issue ~/secret.token
      output: "Waiting for token status ...\n\nGrant \"west-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c\"\
        \ is ready\nToken file /run/user/1000/skewer/secret.token created\n\nTransfer\
        \ this file to a remote site. At the remote site,\ncreate a link to this site\
        \ using the \"skupper token redeem\" command:\n\n\tskupper token redeem <file>\n\
        \nThe token expires after 1 use(s) or after 15m0s.\n"
    private:
    - run: skupper token redeem ~/secret.token
      output: 'Waiting for token status ...

        Token "west-cad4f72d-2917-49b9-ab66-cdaca4d6cf9c" has been redeemed

        You can now safely delete /run/user/1000/skewer/secret.token

        '
- title: Expose the TCP echo service
  preamble: 'Create a listener in the private cluster where the client runs and

    a connector in the public cluster where the echo server runs. This

    makes the public echo service reachable inside the private

    namespace as `tcp-go-echo` on port 9090.

    '
  commands:
    private:
    - run: skupper listener create tcp-go-echo 9090
    public:
    - run: skupper connector create tcp-go-echo 9090 --workload deployment/tcp-go-echo
- title: Access the public service remotely
  preamble: 'From the private cluster, forward traffic to the exposed echo

    service and verify that it responds.

    '
  commands:
    private:
    - run: kubectl get svc
      apply: readme
    - run: kubectl port-forward service/tcp-go-echo 9090:9090
      apply: readme
    - run: telnet 0.0.0.0 9090
      apply: readme
      output: 'hello, Skupper

        tcp-go-echo-7ddbc7756c-wxgcq : HELLO, SKUPPER

        '
- commands:
    public:
    - run: skupper site delete --all
    - run: kubectl delete -f ./public/tcp-echo-deployment.yaml
    private:
    - run: skupper site delete --all
  name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: 'To remove Skupper and the other resources from this exercise, use

    the following commands.'
summary: 'The TCP echo server runs only in the public cluster, but Skupper

  exposes it as a local service in the private cluster. By forwarding

  to the private cluster, you can reach the public service without

  opening any ports on the private side. Skupper handles the encrypted

  traffic between clusters transparently, so the echo replies arrive as

  if the service were running locally.

  '

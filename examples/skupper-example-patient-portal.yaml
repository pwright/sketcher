title: Patient Portal
subtitle: A simple database-backed web application that runs in the public cloud but
  keeps its data in a private database
overview: "This example is a simple database-backed web application that shows\nhow\
  \ you can use Skupper to access a database at a remote site\nwithout exposing it\
  \ to the public internet.\n\nIt contains three services:\n\n  * A PostgreSQL database\
  \ running on a bare-metal or virtual\n    machine in a private data center.\n\n\
  \  * A payment-processing service running on Kubernetes in a private\n    data center.\n\
  \n  * A web frontend service running on Kubernetes in the public\n    cloud.  It\
  \ uses the PostgreSQL database and the\n    payment-processing service.\n\nThe example\
  \ uses two Kubernetes namespaces, `private` and `public`,\nto represent the Kubernetes\
  \ cluster in the private data center and\nthe cluster in the public cloud.  It uses\
  \ Podman to run the\ndatabase.\n\n<img src=\"diagram.png\" width=\"640\"/>\n"
sites:
  public:
    title: Public
    platform: kubernetes
    namespace: public
    env:
      KUBECONFIG: ~/.kube/config-public
  private:
    title: Private
    platform: kubernetes
    namespace: private
    env:
      KUBECONFIG: ~/.kube/config-private
  podman:
    title: Podman
    platform: podman
    env:
      SKUPPER_PLATFORM: podman
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: 'Skupper is designed for use with multiple Kubernetes clusters.

    The `skupper` and `kubectl` commands use your

    [kubeconfig][kubeconfig] and current context to select the cluster

    and namespace where they operate.


    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/


    This example uses multiple cluster contexts at once. The

    `KUBECONFIG` environment variable tells `skupper` and `kubectl`

    which kubeconfig to use.


    For each cluster, open a new terminal window.  In each terminal,

    set the `KUBECONFIG` environment variable to a different path and

    log in to your cluster.'
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    public:
    - run: export KUBECONFIG=~/.kube/config-public
    - run: <provider-specific login command>
      apply: readme
    private:
    - run: export KUBECONFIG=~/.kube/config-private
    - run: <provider-specific login command>
      apply: readme
- title: Create your Kubernetes namespaces
  numbered: true
  preamble: 'The example application has different components deployed to

    different Kubernetes namespaces.  To set up our example, we need

    to create the namespaces.


    For each cluster, use `kubectl create namespace` and `kubectl

    config set-context` to create the namespace you wish to use and

    set the namespace on your current context.'
  commands:
    public:
    - run: kubectl create namespace public
      apply: readme
    - run: kubectl create namespace public --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace public
    private:
    - run: kubectl create namespace private
      apply: readme
    - run: kubectl create namespace private --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace private
- title: Set up your Podman environment
  numbered: true
  preamble: 'Open a new terminal window and set the `SKUPPER_PLATFORM`

    environment variable to `podman`.  This sets the Skupper platform

    to Podman for this terminal session.


    The `skupper system install` enables the Podman API

    service (using systemctl) if that service is not already running.

    The `skupper system install` command also creates the

    Skupper controller container for the current user.'
  postamble: 'If `skupper system install` fails, it is typically due to a systemctl
    issue. You can try the `podman

    system service` command instead:


    ~~~

    podman system service --time 0 unix://$XDG_RUNTIME_DIR/podman/podman.sock &

    ~~~'
  commands:
    podman:
    - run: export SKUPPER_PLATFORM=podman
    - run: skupper system install
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: 'Using Skupper on Kubernetes requires the installation of the

    Skupper custom resource definitions (CRDs) and the Skupper

    controller.


    For each cluster, use `kubectl apply` with the Skupper

    installation YAML to install the CRDs and controller.'
  commands:
    public:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    private:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Install the Skupper command-line tool
  numbered: true
  preamble: 'This example uses the Skupper command-line tool to create Skupper

    resources.  You need to install the `skupper` command only once

    for each development environment.


    On Linux or Mac, you can use the install script (inspect it

    [here][install-script]) to download and extract the command:


    ~~~ shell

    curl https://skupper.io/v2/install.sh | sh

    ~~~


    The script installs the command under your home directory.  It

    prompts you to add the command to your path if necessary.


    For Windows and other installation options, see [Installing

    Skupper][install-docs].


    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh

    [install-docs]: https://skupper.io/#installation'
- title: Deploy the application
  preamble: 'Use `kubectl apply` to deploy the frontend and payment processor

    on Kubernetes.  Use `podman run` to start the database on your

    local machine.


    **Note:** It is important to name your running container using

    `--name` to avoid a collision with the container that Skupper

    creates for accessing the service.


    **Note:** You must use `--network skupper` with the `podman run`

    command.

    '
  commands:
    public:
    - run: kubectl apply -f frontend/kubernetes.yaml
    - await_resource: deployment/frontend
    private:
    - run: kubectl apply -f payment-processor/kubernetes.yaml
    - await_resource: deployment/payment-processor
    podman:
    - run: podman network create skupper
    - run: podman run --name database-target --detach --rm -p 5432:5432 quay.io/skupper/patient-portal-database
- title: Create your sites
  preamble: 'Use `skupper site create` to configure each location.  Enable

    link access on Public so it can issue tokens for the other sites.

    Disable ingress on Private and Podman.

    '
  commands:
    public:
    - run: skupper site create public --enable-link-access
    private:
    - run: skupper site create private
    podman:
    - run: skupper system install
    - run: skupper site create podman
    - run: skupper system start
- title: Link your sites
  preamble: 'Use `skupper token issue` in Public to generate a token that can

    be redeemed by both Private and Podman.  Then, use `skupper token

    redeem` from each remote site to create the links.

    '
  commands:
    public:
    - run: skupper token issue --redemptions-allowed 2 ~/secret.token
    private:
    - run: skupper token redeem ~/secret.token
    podman:
    - run: skupper token redeem ~/secret.token
- title: Expose application services
  preamble: 'Use listeners at the consumer site and connectors where each

    service runs.


    In Public, create listeners for the payment processor and

    database.  In Private, create a connector to the

    payment-processor workload.  In Podman, create a connector to

    the database container.


    **Note:** Podman sites do not automatically replicate services

    to remote sites.  You need to define the listener on each site

    where you wish to make a service available.

    '
  commands:
    public:
    - run: skupper listener create payment-processor 8080
    - run: skupper listener create database 5432
    private:
    - run: skupper connector create payment-processor 8080
    podman:
    - run: skupper connector create database 5432 --host database-target
- name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: 'To remove Skupper and the other resources from this exercise, use

    the following commands.'
  commands:
    public:
    - run: skupper delete
    private:
    - run: skupper delete
    podman:
    - run: skupper delete
- title: Cleaning up
  commands:
    public:
    - run: skupper site delete --all
    - run: kubectl delete deployment/frontend
    private:
    - run: skupper site delete --all
    - run: kubectl delete deployment/payment-processor
    podman:
    - run: skupper site delete --all
    - run: podman stop database-target

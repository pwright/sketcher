title: Skupper Hello World private to private
subtitle: Connect services in isolated on-prem sites
overview: |
  This example is a basic multi-service HTTP application deployed
  across two Kubernetes clusters, each in its own private data center.

  It contains two services:

  * A backend service that exposes an `/api/hello` endpoint.  It
    returns greetings of the form `Hi, <your-name>.  I am <my-name>
    (<pod>)`.

  * A frontend service that connects to the backend.  It sends
    greetings to the backend and fetches new greetings in response.

  The backend service runs in on-prem cluster "private1", and the
  frontend service runs in on-prem cluster "private2".  The private
  sites are linked by a relay site in the public cloud.  Skupper
  enables the frontend to connect to the backend over a secure
  dedicated application network.

  <img src="images/entities.svg" style="max-width: 100%;"/>
sites:
  private1:
    title: Private 1
    platform: kubernetes
    namespace: private1
    env:
      KUBECONFIG: ~/.kube/config-private1
  private2:
    title: Private 2
    platform: kubernetes
    namespace: private2
    env:
      KUBECONFIG: ~/.kube/config-private2
  relay:
    title: Relay
    platform: kubernetes
    namespace: relay
    env:
      KUBECONFIG: ~/.kube/config-relay
steps:
- title: Access your Kubernetes clusters
  numbered: true
  preamble: |-
    Skupper is designed for use with multiple Kubernetes clusters.
    The `skupper` and `kubectl` commands use your
    [kubeconfig][kubeconfig] and current context to select the cluster
    and namespace where they operate.

    [kubeconfig]: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/

    This example uses multiple cluster contexts at once. The
    `KUBECONFIG` environment variable tells `skupper` and `kubectl`
    which kubeconfig to use.

    For each cluster, open a new terminal window.  In each terminal,
    set the `KUBECONFIG` environment variable to a different path and
    log in to your cluster.
  postamble: '**Note:** The login procedure varies by provider.'
  commands:
    private1:
    - run: export KUBECONFIG=~/.kube/config-private1
    - run: <provider-specific login command>
      apply: readme
    private2:
    - run: export KUBECONFIG=~/.kube/config-private2
    - run: <provider-specific login command>
      apply: readme
    relay:
    - run: export KUBECONFIG=~/.kube/config-relay
    - run: <provider-specific login command>
      apply: readme
- title: Create your Kubernetes namespaces
  numbered: true
  preamble: |-
    The example application has different components deployed to
    different Kubernetes namespaces.  To set up our example, we need
    to create the namespaces.

    For each cluster, use `kubectl create namespace` and `kubectl
    config set-context` to create the namespace you wish to use and
    set the namespace on your current context.
  commands:
    private1:
    - run: kubectl create namespace private1
      apply: readme
    - run: kubectl create namespace private1 --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace private1
    private2:
    - run: kubectl create namespace private2
      apply: readme
    - run: kubectl create namespace private2 --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace private2
    relay:
    - run: kubectl create namespace relay
      apply: readme
    - run: kubectl create namespace relay --dry-run=client -o yaml | kubectl apply
        -f -
      apply: test
    - run: kubectl config set-context --current --namespace relay
- title: Deploy the frontend and backend
  numbered: true
  preamble: |-
    Deploy the Hello World components, placing the frontend on one
    cluster and the backend on the other.

    Use `kubectl create deployment` to deploy the frontend in Private 1
    and the backend in Private 2.
  commands:
    private1:
    - run: kubectl create deployment frontend --image quay.io/skupper/hello-world-frontend
      apply: readme
    - run: kubectl create deployment frontend --image quay.io/skupper/hello-world-frontend
        --dry-run=client -o json | jq '.spec.template.spec.containers |= map(.imagePullPolicy
        = "IfNotPresent")' | kubectl apply -f -
      apply: test
    private2:
    - run: kubectl create deployment backend --image quay.io/skupper/hello-world-backend
        --replicas 3
      apply: readme
    - run: kubectl create deployment backend --image quay.io/skupper/hello-world-backend
        --replicas 3 --dry-run=client -o json | jq '.spec.template.spec.containers
        |= map(.imagePullPolicy = "IfNotPresent")' | kubectl apply -f -
      apply: test
- title: Install Skupper on your Kubernetes clusters
  numbered: true
  preamble: |-
    Using Skupper on Kubernetes requires the installation of the
    Skupper custom resource definitions (CRDs) and the Skupper
    controller.

    For each cluster, use `kubectl apply` with the Skupper
    installation YAML to install the CRDs and controller.
  commands:
    private1:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    private2:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
    relay:
    - run: kubectl apply -f https://skupper.io/v2/install.yaml
      apply: readme
    - run: curl https://skupper.io/v2/install.yaml | sed s/Always/IfNotPresent/g |
        kubectl apply -f -
      apply: test
- title: Install the Skupper command-line tool
  numbered: true
  preamble: |-
    This example uses the Skupper command-line tool to create Skupper
    resources.  You need to install the `skupper` command only once
    for each development environment.

    On Linux or Mac, you can use the install script (inspect it
    [here][install-script]) to download and extract the command:

    ~~~ shell
    curl https://skupper.io/v2/install.sh | sh
    ~~~

    The script installs the command under your home directory.  It
    prompts you to add the command to your path if necessary.

    For Windows and other installation options, see [Installing
    Skupper][install-docs].

    [install-script]: https://github.com/skupperproject/skupper-website/blob/main/input/install.sh
    [install-docs]: https://skupper.io/#installation
- commands:
    private1:
    - run: skupper site create private1
    private2:
    - run: skupper site create private2
    relay:
    - run: skupper site create relay --enable-link-access
  title: Create your sites
  numbered: true
  preamble: |-
    A Skupper _site_ is a location where your application workloads
    are running.  Sites are linked together to form a network for your
    application.

    For each namespace, use `skupper site create` with a site name of
    your choice.  This creates the site resource and deploys the
    Skupper router to the namespace.

    **Note:** If you are using Minikube, you need to [start minikube
    tunnel][minikube-tunnel] before you run `skupper site create`.

    <!-- XXX Explain enabling link acesss on one of the sites -->

    [minikube-tunnel]: https://skupper.io/start/minikube.html#running-minikube-tunnel
  postamble: |-
    You can use `skupper site status` at any time to check the status
    of your site.
- preamble: |-
    A Skupper _link_ is a channel for communication between two sites.
    Links serve as a transport for application connections and
    requests.

    Creating a link requires the use of two Skupper commands in
    conjunction: `skupper token issue` and `skupper token redeem`.
    The `skupper token issue` command generates a secret token that
    can be transferred to a remote site and redeemed for a link to the
    issuing site.  The `skupper token redeem` command uses the token
    to create the link.

    **Note:** The link token is truly a *secret*.  Anyone who has the
    token can link to your site.  Make sure that only those you trust
    have access to it.

    First, use `skupper token issue` in Relay to generate a token
    for each private site.  Then, use `skupper token redeem` in
    Private 1 and 2 to link the sites.
  commands:
    relay:
    - run: skupper token issue ~/relay1.token
    - run: skupper token issue ~/relay2.token
    private1:
    - run: skupper token redeem ~/relay1.token
    private2:
    - run: skupper token redeem ~/relay2.token
  title: Link your sites
  numbered: true
  postamble: |-
    If your terminal sessions are on different machines, you may need
    to use `scp` or a similar tool to transfer the token securely.  By
    default, tokens expire after a single use or 15 minutes after
    being issued.
- title: Expose the backend service
  numbered: true
  preamble: |-
    We now have our sites linked to form a Skupper network, but no
    services are exposed on it.

    Skupper uses _listeners_ and _connectors_ to expose services
    across sites inside a Skupper network.  A listener is a local
    endpoint for client connections, configured with a routing key.  A
    connector exists in a remote site and binds a routing key to a
    particular set of servers.  Skupper routers forward client
    connections from local listeners to remote connectors with
    matching routing keys.

    In Private 1, use the `skupper listener create` command to create a
    listener for the backend.  In Private 2, use the `skupper connector
    create` command to create a matching connector.
  postamble: |-
    The commands shown above use the name argument, `backend`, to also
    set the default routing key and pod selector.  You can use the
    `--routing-key` and `--selector` options to set specific values.

    <!-- You can also use `--workload` -- more convenient! -->
  commands:
    private1:
    - run: skupper listener create backend 8080
      output: |
        Waiting for create to complete...
        Listener "backend" is ready
    private2:
    - run: skupper connector create backend 8080
      output: |
        Waiting for create to complete...
        Connector "backend" is ready
- title: Access the frontend service
  numbered: true
  preamble: |-
    In order to use and test the application, we need external access
    to the frontend.

    Use `kubectl port-forward` to make the frontend available at
    `localhost:8080`.
  postamble: |-
    You can now access the web interface by navigating to
    [http://localhost:8080](http://localhost:8080) in your browser.
  commands:
    private1:
    - await_resource: deployment/frontend
    - run: kubectl port-forward deployment/frontend 8080:8080
      apply: readme
    - run: kubectl port-forward deployment/frontend 8080:8080 > /dev/null &
      apply: test
    - await_port: 8080
    - run: curl http://localhost:8080/api/health
      apply: test
- commands:
    private1:
    - run: skupper site delete --all
    - run: kubectl delete deployment/frontend
    private2:
    - run: skupper site delete --all
    - run: kubectl delete deployment/backend
    relay:
    - run: skupper site delete --all
  name: cleaning_up
  title: Cleaning up
  numbered: false
  preamble: |-
    To remove Skupper and the other resources from this exercise, use
    the following commands:

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sketcher"
version = "0.2.0"  # Split: Python handles YAML processing, Go handles execution
description = "YAML processing and Markdown generation for Skupper examples"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    {name = "Sketcher Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
]

[project.scripts]
skewer = "sketcher.cli:main"

[project.urls]
Homepage = "https://github.com/skupperproject/skupper"
Repository = "https://github.com/skupperproject/skupper"

[tool.setuptools.packages.find]
where = ["."]
include = ["sketcher*"]

[tool.setuptools.package-data]
sketcher = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
